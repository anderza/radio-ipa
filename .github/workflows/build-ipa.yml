name: Сборка RockRadioNet iOS (IPA)

# Запускается, когда в корень репозитория загружен архив *iOS*.zip (или этот файл изменён),
# а также вручную: Actions → «Сборка RockRadioNet iOS (IPA)» → Run workflow.
# IPA собирается без подписи: его подписывает Sideloadly на Windows/Mac своим Apple ID.
on:
  push:
    paths:
      - "*iOS*.zip"
      - "*ios*.zip"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    name: iOS (IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Выбрать Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)/Contents/Developer"
      - name: Версии инструментов
        run: |
          xcodebuild -version
          xcrun simctl list runtimes || true
      - name: Распаковать проект
        run: |
          echo "Файлы в репозитории:"; ls -la
          # Если в репозитории несколько архивов (например, «… (1).zip», который добавил браузер),
          # берём тот, что загружен последним.
          Z=""; BEST=0
          for f in *[Ii][Oo][Ss]*.zip; do
            [ -f "$f" ] || continue
            T=$(git log -1 --format=%ct -- "$f")
            echo "  $f, загружен: $(TZ=UTC git log -1 --format=%cd --date=format-local:'%Y-%m-%d %H:%M:%S' -- "$f") UTC"
            if [ "${T:-0}" -gt "$BEST" ]; then BEST=${T:-0}; Z=$f; fi
          done
          if [ -z "$Z" ]; then echo "::error::Не найден архив iOS (*iOS*.zip) в корне репозитория"; exit 1; fi
          echo "Распаковываю: $Z"
          unzip -q "$Z" -d src
          D=$(dirname "$(find src -name project.yml | head -1)")
          if [ -z "$D" ] || [ "$D" = "." ]; then echo "::error::В архиве нет проекта iOS (project.yml)"; exit 1; fi
          echo "PROJ=$PWD/$D" >> "$GITHUB_ENV"
      - name: Установить XcodeGen
        run: brew install xcodegen
      - name: Создать проект Xcode
        run: cd "$PROJ" && xcodegen generate
      - name: Собрать приложение (без подписи)
        run: |
          set -o pipefail
          cd "$PROJ" && xcodebuild \
            -project RockRadioNet.xcodeproj \
            -scheme RockRadioNet \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Показать ошибки сборки
        if: failure()
        run: |
          echo "===== ОШИБКИ СБОРКИ ====="
          grep -E "error:|fatal error|BUILD FAILED" build.log | sort -u | head -60 || true
          grep "error:" build.log | sort -u | head -5 | while IFS= read -r l; do echo "::error::$l"; done || true
          echo "----- упавшие команды -----"
          grep -A6 "The following build commands failed" build.log | head -20 || true
          { echo '### Ошибки сборки'; echo '```'; grep -E "error:|fatal error|BUILD FAILED" build.log | sort -u | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Сохранить журнал сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RockRadioNet-build-log
          path: build.log
          if-no-files-found: ignore
      - name: Упаковать IPA
        run: |
          APP="$PROJ/build/Build/Products/Release-iphoneos/RockRadioNet.app"
          if [ ! -d "$APP" ]; then echo "::error::Приложение не собралось"; exit 1; fi
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qr RockRadioNet.ipa Payload
          rm -rf Payload
          ls -la RockRadioNet.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: RockRadioNet-IPA
          path: RockRadioNet.ipa
      - name: Выложить в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "ios-${{ github.run_number }}-${{ github.run_attempt }}" RockRadioNet.ipa --repo "${{ github.repository }}" --title "RockRadioNet для iOS — сборка ${{ github.run_number }}" --notes "Скачайте RockRadioNet.ipa и установите через Sideloadly (подпишите своим Apple ID)."
